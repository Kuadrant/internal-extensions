---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-policy-extension
  namespace: kuadrant-extensions
  labels:
    app.kubernetes.io/name: pipeline-policy-extension
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pipeline-policy-extension
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipeline-policy-extension
    spec:
      serviceAccountName: pipeline-policy-extension
      securityContext:
        runAsNonRoot: true
      containers:
      - name: pipeline-policy
        image: pipeline-policy:dev
        imagePullPolicy: Always
        env:
        - name: KUADRANT_EXTENSION_ADDRESS
          value: "kuadrant-operator-extensions.kuadrant-system.svc:50052"
        - name: KUADRANT_EXTENSION_TOKEN_FILE
          value: "/var/run/secrets/kuadrant/token"
        volumeMounts:
        - name: kuadrant-token
          mountPath: /var/run/secrets/kuadrant
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: kuadrant-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: kuadrant-extensions
              expirationSeconds: 3600
